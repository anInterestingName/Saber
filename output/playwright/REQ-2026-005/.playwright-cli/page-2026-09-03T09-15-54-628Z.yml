            - region "为何需要BladeX" [ref=e254]:
              - generic [ref=e255]:
                - generic [ref=e256]: 1.经历过较长的线上生产，积累了很多企业痛点的解决方案
                - generic [ref=e257]: 2.一套代码兼容MySql、Oracle、PostgreSQL，适应企业各种不同场景的需求
                - generic [ref=e258]: 3.集成了很多企业急切所需的例如多租户、Oauth2授权认证、工作流、分布式事务等等功能
                - generic [ref=e259]: 4.深度定制了Flowable工作流，完美支持SpringCloud分布式服务的场景，以远程调用的方式进行操作
                - generic [ref=e260]: 5.升级了核心驱动，新功能完全可以开箱即用，而开源版需要自己再花时间进行集成，需要花掉更多的时间成本
                - generic [ref=e261]: 6.拥抱微服务时代，很多企业由于项目转型或升级，传统的技术已然不能满足，反而会花更多成本，而BladeX就是为此而生
                - generic [ref=e262]: 7.同时提供SpringCloud版本和SpringBoot版本，两个版本的api可以与Sword和Saber无缝对接，为小型项目至大型项目保驾护航
                - generic [ref=e263]: 8.授权购买即永久，源码没有混淆，完全开放，后续升级完全免费。企业只需花很少的钱即可获得一整套成熟的解决方案，你还在等什么？
