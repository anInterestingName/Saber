# 定义 Saber 静态站点使用的 Nginx 虚拟主机。
server {
  # 在容器内部监听 HTTP 80 端口，并设为默认站点。
  listen 80 default_server;
  # 接受任意 Host，由外部反向代理或 Ingress 负责真实域名。
  server_name _;

  # 隐藏响应头中的 Nginx 详细版本，减少不必要的信息暴露。
  server_tokens off;
  # 指定 Vite 生产构建产物所在的静态文件根目录。
  root /usr/share/nginx/html;
  # 将 index.html 设置为目录请求的默认入口文件。
  index index.html;
  # 为文本响应声明 UTF-8 字符集，确保中文内容正确显示。
  charset utf-8;

  # 加载常见静态文件扩展名与 Content-Type 的映射关系。
  include /etc/nginx/mime.types;
  # 对未匹配到扩展名的文件使用二进制流类型。
  default_type application/octet-stream;
  # 启用 sendfile 以减少发送静态文件时的用户态数据复制。
  sendfile on;
  # 启用实体标签，帮助浏览器通过条件请求判断资源是否变化。
  etag on;
  # 禁止浏览器对响应执行 MIME 类型猜测。
  add_header X-Content-Type-Options nosniff always;

  # 启用运行时 gzip 压缩，作为预压缩文件不可用时的回退。
  gzip on;
  # 优先发送 Vite 构建阶段生成的 .gz 预压缩静态文件。
  gzip_static on;
  # 仅对超过一千字节的响应执行动态 gzip，避免小文件压缩开销。
  gzip_min_length 1000;
  # 声明适合压缩的文本、脚本、JSON、XML 和 SVG 响应类型。
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

  # 为容器平台提供不依赖业务后端的存活检查端点。
  location = /healthz {
    # 健康检查请求不写入访问日志，避免周期性探活产生噪声。
    access_log off;
    # 明确健康检查响应是 UTF-8 纯文本。
    default_type text/plain;
    # 直接返回 HTTP 200 和固定正文，不访问磁盘或后端服务。
    return 200 'ok';
  # 结束健康检查端点配置块。
  }

  # 对 Vite 生成的带内容哈希资源应用长期不可变缓存。
  location ^~ /assets/ {
    # 静态资源不存在时直接返回 404，避免把 index.html 错当成脚本或样式。
    try_files $uri =404;
    # 通过标准过期时间让浏览器和中间缓存保存资源一年。
    expires 1y;
    # 明确资源可公开缓存且文件内容在该 URL 生命周期内不变化。
    add_header Cache-Control "public, max-age=31536000, immutable";
  # 结束哈希静态资源配置块。
  }

  # 单独处理 SPA 入口文件，防止客户端长期缓存旧版本资源清单。
  location = /index.html {
    # 确认入口文件真实存在，不存在时返回 404。
    try_files /index.html =404;
    # 让标准过期时间立即失效，要求客户端重新验证入口文件。
    expires -1;
    # 禁止存储入口响应，确保部署新版本后及时获取新资源地址。
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  # 结束入口文件专用配置块。
  }

  # 处理根路径、普通静态文件以及 Vue Router History 子路由。
  location / {
    # 优先返回真实文件或目录，不存在时回退 index.html 交给 Vue Router。
    try_files $uri $uri/ /index.html;
  # 结束 SPA 通用路由配置块。
  }
# 结束 Saber 虚拟主机配置块。
}
