              - region "什么是BladeX" [ref=f1e155]:
                - generic [ref=f1e156]:
                  - generic [ref=f1e157]: 1.BladeX是一款精心设计的微服务架构，提供 SpringCloud 全套解决方案
                  - generic [ref=f1e158]: 2.开源中国首批完美集成 SpringCloud Alibaba 系列组件的微服务架构
                  - generic [ref=f1e159]: 3.基于稳定生产的商业项目升级优化而来，更加贴近企业级的需求
                  - generic [ref=f1e160]: 4.追求企业开发更加高效，部署更加方便，生产更加稳定
                  - generic [ref=f1e161]: 5.GVP-码云最有价值开源项目
